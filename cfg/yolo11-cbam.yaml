# YOLO11 + CBAM  -  the VISUAL-ATTENTION CONTROL for the TG-FEM comparison.
#
# Structurally identical to cfg/yolo11-tgfem.yaml: CBAM sits at exactly the same
# three positions (layers 5, 8, 13). The ONLY difference is where the attention
# gates come from:
#
#     CBAM   gates derived from the feature map's own pooled statistics
#     TG-FEM gates derived from S, the text-conditioned response map
#
# That isolates the contribution of *text conditioning* from the contribution of
# *attention as such* - which is the whole point of ablation (g) in the report,
# and the only way to show TG-FEM beats CBAM for the stated reason.
#
# NOTE ON CHANNELS: CBAM's first constructor argument is c1 (input channels).
# `parse_model` has no special case for CBAM, so it falls through to
# `else: c2 = ch[f]` and passes these args verbatim - meaning the channel counts
# below must be written explicitly. They are correct for the **n** scale only
# (width=0.25): P3=128, P4=128, P5=256. Re-derive them if you change scale.

nc: 6 # NEU-DET; overridden by the dataset YAML at train time
scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, CBAM, [128, 7]] # 5  <-- CBAM @ P3 (80x80), c1=128
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7
  - [-1, 1, CBAM, [128, 7]] # 8  <-- CBAM @ P4 (40x40), c1=128
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True]] # 10
  - [-1, 1, SPPF, [1024, 5]] # 11
  - [-1, 2, C2PSA, [1024]] # 12
  - [-1, 1, CBAM, [256, 7]] # 13 <-- CBAM @ P5 (20x20), c1=256

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 8], 1, Concat, [1]] # 15  cat CBAM P4
  - [-1, 2, C3k2, [512, False]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 5], 1, Concat, [1]] # 18  cat CBAM P3
  - [-1, 2, C3k2, [256, False]] # 19 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21  cat head P4
  - [-1, 2, C3k2, [512, False]] # 22 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24  cat CBAM P5
  - [-1, 2, C3k2, [1024, True]] # 25 (P5/32-large)

  - [[19, 22, 25], 1, Detect, [nc]] # 26 Detect(P3, P4, P5)
